# Builds the module against the platform's packages (soft-square-net GitHub Packages feed, version pinned in
# global.json) and keeps its build output as an artifact.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # NuGet.Config reads the feed's token from here.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      # ImageSharp 4 (thumbnails) checks its Six Labors license in Release builds; MSBuild reads this as the
      # SixLaborsLicenseKey property. See Directory.Build.props. Never commit the key or a sixlabors.lic file.
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Six Labors license
        if: env.SixLaborsLicenseKey == ''
        run: |
          echo "::error::The SIXLABORS_LICENSE_KEY secret is missing. ImageSharp 4 needs a Six Labors license key in Release builds: add it as a repository (or organization) Actions secret named SIXLABORS_LICENSE_KEY."
          exit 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build ModularBlazor.Module.Storage.slnx -c Release

      - name: Test
        run: dotnet test ModularBlazor.Module.Storage.slnx -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: src/*/bin/Release/net10.0/
